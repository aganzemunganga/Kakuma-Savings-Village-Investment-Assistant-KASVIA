<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4C41">
<title>KASVIA — Kakuma Savings &amp; Village Investment Assistant</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- iOS: lets Safari's "Add to Home Screen" open KASVIA full-screen, without a browser
     address bar, even though iOS does not use manifest.json for this. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KASVIA">
<style>
:root{
  --ink:#12211D;
  --ink-soft:#4B5D58;
  --paper:#F6F4EC;
  --panel:#FFFFFF;
  --line:#DDD9C8;
  --forest:#0F4C41;
  --forest-deep:#0A332C;
  --forest-tint:#E4EEEA;
  --gold:#C88A2B;
  --gold-tint:#F6E9D3;
  --clay:#B5502F;
  --clay-tint:#F5E1D6;
  --ok:#2C7A4B;
  --ok-tint:#DFF0E4;
  --warn:#B5502F;
  --radius:10px;
  --shadow:0 1px 2px rgba(18,33,29,.06), 0 8px 24px -12px rgba(18,33,29,.18);
  font-size:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Georgia,"Iowan Old Style","Times New Roman",serif; letter-spacing:.2px; margin:0 0 4px;}
.mono{font-variant-numeric:tabular-nums;}
button,input,select,textarea{font-family:inherit;font-size:1rem;}
button{cursor:pointer}
a{color:var(--forest)}
#app{min-height:100%;display:flex;flex-direction:column}

/* ===== Top-level auth screens ===== */
.centerscreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(1200px 600px at 15% -10%, #163F37 0%, transparent 60%),
  linear-gradient(160deg, var(--forest-deep), var(--forest) 55%, #0C3830 100%);
}
.authcard{width:100%;max-width:420px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:32px 28px;}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brandmark{width:44px;height:44px;border-radius:10px;background:linear-gradient(160deg,var(--gold),#A86B1E);display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:20px;flex:none}
.brandtext .k{font-size:1.4rem;font-weight:700;letter-spacing:1px;color:var(--forest-deep)}
.brandtext .sub{font-size:.78rem;color:var(--ink-soft)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--forest);outline-offset:1px;border-color:var(--forest)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:.92rem;transition:transform .05s ease}
.btn-primary{background:var(--forest);color:#fff}
.btn-primary:hover{background:var(--forest-deep)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#A86B1E}
.btn-ghost{background:transparent;color:var(--forest);border-color:var(--line)}
.btn-ghost:hover{background:var(--forest-tint)}
.btn-danger{background:#fff;color:var(--clay);border-color:var(--clay)}
.btn-danger:hover{background:var(--clay-tint)}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{padding:6px 10px;font-size:.8rem;border-radius:6px}
.msg{font-size:.85rem;padding:10px 12px;border-radius:8px;margin-bottom:14px}
.msg-error{background:var(--clay-tint);color:var(--clay)}
.msg-ok{background:var(--ok-tint);color:var(--ok)}
.msg-info{background:var(--forest-tint);color:var(--forest-deep)}
.hint{font-size:.76rem;color:var(--ink-soft);margin-top:4px}
.role-pills{display:flex;gap:8px;margin-bottom:16px}
.role-pill{flex:1;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:8px;font-size:.78rem;font-weight:600;color:var(--ink-soft);cursor:pointer;background:#fff}
.role-pill.active{border-color:var(--forest);background:var(--forest-tint);color:var(--forest-deep)}

/* ===== App shell ===== */
.shell{display:flex;min-height:100vh;width:100%}
.sidebar{width:230px;flex:none;background:var(--forest-deep);color:#EFEBDC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar .brand{padding:18px 16px;margin:0;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar .brandtext .k{color:#fff}
.sidebar .brandtext .sub{color:#B7C7C1}
.navlist{list-style:none;margin:0;padding:10px}
.navlist li a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#D7E4DE;text-decoration:none;font-size:.88rem;font-weight:500;margin-bottom:2px}
.navlist li a:hover{background:rgba(255,255,255,.06)}
.navlist li a.active{background:var(--gold);color:#1D1204;font-weight:700}
.navlist .navicon{width:18px;text-align:center;flex:none;font-size:1rem}
.sidebar-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.1);font-size:.78rem;color:#9FB2AB}
.userchip{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#1D1204;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:rgba(246,244,236,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px}
.topbar h2{font-size:1.15rem;margin:0}
.topbar .spacer{flex:1}
.searchbox{position:relative}
.searchbox input{width:230px;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:.85rem}
.searchbox::before{content:"🔎";position:absolute;left:10px;top:7px;font-size:.8rem;opacity:.6}
.menubtn{display:none;background:none;border:none;font-size:1.3rem;color:var(--forest-deep)}
.content{padding:22px;flex:1}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.2px}
.badge-pending{background:var(--gold-tint);color:#8A5B12}
.badge-approved,.badge-active,.badge-paid,.badge-ok{background:var(--ok-tint);color:var(--ok)}
.badge-rejected,.badge-defaulted,.badge-overdue{background:var(--clay-tint);color:var(--clay)}
.badge-disbursed{background:var(--forest-tint);color:var(--forest-deep)}
.badge-voided{background:#eee;color:#888;text-decoration:line-through}

.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat-card .label{font-size:.74rem;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft);font-weight:700}
.stat-card .value{font-size:1.5rem;font-weight:700;margin-top:4px;color:var(--forest-deep)}
.stat-card .value.gold{color:var(--gold)}
.stat-card .value.clay{color:var(--clay)}
.stat-card .sub{font-size:.72rem;color:var(--ink-soft);margin-top:2px}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.section-title h3{font-size:1.02rem}
.section-title:first-child{margin-top:0}

table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
thead th{background:var(--forest-tint);color:var(--forest-deep);text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line)}
tbody td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:.87rem}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAF9F2}
.tablewrap{overflow-x:auto;border-radius:var(--radius)}
.right{text-align:right}
.center{text-align:center}
.muted{color:var(--ink-soft)}
.small{font-size:.78rem}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .spacer{flex:1}
.pillfilter{display:flex;gap:6px;flex-wrap:wrap}
.pillfilter button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:20px;font-size:.78rem;color:var(--ink-soft);font-weight:600}
.pillfilter button.active{background:var(--forest);color:#fff;border-color:var(--forest)}

.modal-backdrop{position:fixed;inset:0;background:rgba(18,33,29,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal.wide{max-width:760px}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0}
.modal-close{background:none;border:none;font-size:1.3rem;color:var(--ink-soft)}
.modal-body{padding:20px 22px}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px}
legend{font-size:.78rem;font-weight:700;color:var(--forest-deep);padding:0 6px}

.toast-wrap{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--forest-deep);color:#fff;padding:10px 16px;border-radius:8px;font-size:.85rem;box-shadow:var(--shadow);animation:slidein .2s ease}
.toast.err{background:var(--clay)}
.toast.ok{background:var(--ok)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

.empty{text-align:center;padding:40px 20px;color:var(--ink-soft)}
.empty .big{font-size:2rem;margin-bottom:8px}

.receipt{max-width:380px;margin:0 auto;background:#fff;border:1px dashed var(--line);padding:20px;font-size:.85rem}
.receipt h3{text-align:center;margin-bottom:2px}
.receipt .sub{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-bottom:14px}
.receipt table{border:none}
.receipt td{border:none;padding:4px 0}
.receipt .tot{border-top:1px solid var(--line);font-weight:700}
.receipt .sig{margin-top:30px;border-top:1px solid var(--ink);padding-top:4px;font-size:.75rem;text-align:center;width:60%;margin-left:auto;margin-right:auto}

.wizard-steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.wizard-steps .dot{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wizard-steps .dot.done{background:var(--forest)}
.wizard-steps .dot.now{background:var(--gold)}

@media print{
  .noprint{display:none !important}
  body{background:#fff}
  .content{padding:0}
  .shell{display:block}
  .receipt{border:none}
}
@media(max-width:900px){
  .sidebar{position:fixed;left:-240px;top:0;z-index:50;transition:left .18s ease;box-shadow:var(--shadow)}
  .sidebar.open{left:0}
  .menubtn{display:block}
  .searchbox input{width:150px}
  .grid-2{grid-template-columns:1fr}
  .authcard{padding:24px 18px}
}
.kbd{background:#eee;border-radius:4px;padding:1px 6px;font-size:.75rem;border:1px solid #ccc}
.divider{height:1px;background:var(--line);margin:16px 0}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.formrow{grid-template-columns:1fr}}
.link-btn{background:none;border:none;color:var(--forest);font-weight:600;text-decoration:underline;padding:0;font-size:.85rem}
.progress-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.progress-bar > div{height:100%;background:var(--forest)}
.tag{display:inline-block;background:var(--forest-tint);color:var(--forest-deep);padding:1px 8px;border-radius:10px;font-size:.72rem;font-weight:700;margin-right:4px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>
<script src="db.js"></script>
<script src="util.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>
<script src="modules.js"></script>
<script src="loans.js"></script>
<script src="reports.js"></script>
<script src="install.js"></script>
<script src="main.js"></script>
</body>
</html>
